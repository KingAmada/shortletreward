<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c90000">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>Guest Rewards Spinwheel App</title>
<style>html,body{margin:0;min-height:100%;background:#f6f6f8;font-family:Arial,Helvetica,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;color:#222}.boot b{display:block;font-size:1.15rem}.boot span{display:block;margin-top:8px;color:#777;font-size:.85rem}.loader{width:50px;height:50px;margin:0 auto 16px;border-radius:50%;border:5px solid #eee;border-top-color:#c90000;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="boot"><div><div class="loader"></div><b>Guest Rewards</b><span>Loading weekly rewards…</span></div></div>
<script>
(async()=>{
 const CURRENT="https://raw.githubusercontent.com/KingAmada/shortletreward/98e06f555667cd44cacaaa924a523b61e18a2342/index.html";
 const weekly="    /* === v15 weekly rewards engine === */\n    text=text.replace(\n      '<div class=\"pill\">8 Different Guests Must Win!</div>',\n      '<div class=\"pill\">8 Different Guests Must Win!</div><div class=\"pill\">₦1M Grand Prize Requires 7+ Verified Stay Days</div>'\n    );\n    text=text.replace(\n      '<div class=\"prizeTitle\">This Month’s Private Guest Draw</div>\\n          <div class=\"prizeRow\"><div class=\"prizeAmount\">₦50,000</div><div class=\"prizeMeta\">4 Winners</div></div>\\n          <div class=\"prizeRow\"><div class=\"prizeAmount\">₦100,000</div><div class=\"prizeMeta\">3 Winners</div></div>\\n          <div class=\"prizeRow\"><div class=\"prizeAmount\">₦1,000,000</div><div class=\"prizeMeta\">1 Winner</div></div>',\n      '<div class=\"prizeTitle\">₦1.5M Monthly Guest Rewards</div><div id=\"activeWeekPill\" style=\"margin:0 auto 12px;width:max-content;max-width:100%;padding:7px 11px;border-radius:999px;background:rgba(240,188,51,.13);border:1px solid rgba(240,188,51,.3);color:#ffe08a;font-size:.7rem;font-weight:950;letter-spacing:.06em;text-transform:uppercase\">Weekly Draw</div>\\n          <div class=\"prizeRow\"><div class=\"prizeAmount\">Week 1</div><div class=\"prizeMeta\">2 × ₦50K = ₦100K</div></div>\\n          <div class=\"prizeRow\"><div class=\"prizeAmount\">Week 2</div><div class=\"prizeMeta\">2 × ₦50K + ₦100K</div></div>\\n          <div class=\"prizeRow\"><div class=\"prizeAmount\">Week 3</div><div class=\"prizeMeta\">2 × ₦100K = ₦200K</div></div>\\n          <div class=\"prizeRow\"><div class=\"prizeAmount\">Week 4</div><div class=\"prizeMeta\">₦1M Grand Prize · 7+ Days</div></div>'\n    );\n    text=text.replace(\n      '<p>The more you stay the more your booking appears on the wheel which means higher chance of you winning the draw.</p>',\n      '<p>Each verified stay-day gives you one wheel slot for that week. Once you win, you are removed from every remaining draw that month. The ₦1,000,000 Grand Prize is for guests with at least 7 verified stay-days during the month.</p>'\n    );\n\n    text=text.replace(\n      \"const PRELOAD_APARTMENTS = Array.from({length:25},(_,i)=>({entryId:'APARTMENT-'+(i+1),label:'Apartment '+String(i+1).padStart(2,'0'),location:'Portfolio',days:1,placeholder:true}));\",\n      \"const PRELOAD_APARTMENTS = Array.from({length:25},(_,i)=>({entryId:'APARTMENT-'+(i+1),label:'Apartment '+String(i+1).padStart(2,'0'),location:'Portfolio',days:1,placeholder:true}));\\n  const WEEKLY_PRIZE_PLAN={1:['₦50,000','₦50,000'],2:['₦50,000','₦50,000','₦100,000'],3:['₦100,000','₦100,000'],4:['₦1,000,000']};\\n  function currentCampaignWeek(d=new Date()){const day=d.getDate();return day<=7?1:day<=14?2:day<=21?3:4;}\\n  function monthBounds(d=new Date()){return{start:new Date(d.getFullYear(),d.getMonth(),1),end:new Date(d.getFullYear(),d.getMonth()+1,1)};}\\n  function weekBounds(d=new Date()){const w=currentCampaignWeek(d),m=monthBounds(d),startDay=w===1?1:w===2?8:w===3?15:22;return{start:new Date(d.getFullYear(),d.getMonth(),startDay),end:w===4?m.end:new Date(d.getFullYear(),d.getMonth(),startDay+7)};}\\n  function overlapDays(e,start,end){if(!e||!e.checkIn||!e.checkOut)return 0;const a=new Date(e.checkIn+'T00:00:00'),b=new Date(e.checkOut+'T00:00:00'),s=new Date(Math.max(a,start)),z=new Date(Math.min(b,end));return Math.max(0,Math.round((z-s)/86400000));}\\n  function inPeriod(ts,start,end){if(!ts)return false;const d=new Date(ts);return d>=start&&d<end;}\\n  function monthResults(){const b=monthBounds();return state.results.filter(r=>inPeriod(r.wonAt,b.start,b.end));}\\n  function weekResults(){const b=weekBounds();return state.results.filter(r=>inPeriod(r.wonAt,b.start,b.end));}\\n  function weeklyWinnerTarget(){return WEEKLY_PRIZE_PLAN[currentCampaignWeek()].length;}\\n  function currentPrize(){const p=WEEKLY_PRIZE_PLAN[currentCampaignWeek()],n=weekResults().length;return p[n]||'Completed';}\\n  function eligibleGuestCount(){return new Set(eligibleEntries().map(e=>e.phone)).size;}\\n  function wonPhonesThisMonth(){return new Set(monthResults().map(r=>r.phone).filter(Boolean));}\\n  function publicWeekResults(rows){const b=weekBounds();return (rows||[]).filter(r=>inPeriod(r.wonAt,b.start,b.end));}\"\n    );\n\n    text=text.replace(\n`  function eligibleEntries(){\n    const won=new Set(state.results.map(r=>r.id));\n    return state.entries.filter(x=>x.status==='verified'&&!won.has(x.id));\n  }`,\n`  function eligibleEntries(){\n    const wonPhones=wonPhonesThisMonth();\n    const week=currentCampaignWeek(), period=week===4?monthBounds():weekBounds();\n    const verified=state.entries.filter(x=>x.status==='verified'&&!wonPhones.has(x.phone));\n    let qualifyingPhones=null;\n    if(week===4){\n      const totals=new Map();\n      verified.forEach(x=>totals.set(x.phone,(totals.get(x.phone)||0)+overlapDays(x,period.start,period.end)));\n      qualifyingPhones=new Set([...totals].filter(([,days])=>days>=7).map(([phone])=>phone));\n    }\n    return verified\n      .filter(x=>!qualifyingPhones||qualifyingPhones.has(x.phone))\n      .map(x=>({...x,days:overlapDays(x,period.start,period.end)}))\n      .filter(x=>x.days>0);\n  }`\n    );\n\n    text=text.replace(\n      \"return state.results.map(w=>({id:w.id,name:compactApartment(w.apartment)+' · '+mask(w.fullName),prize:w.prize,location:w.location,apartment:w.apartment,days:w.days}));\",\n      \"return monthResults().map(w=>({id:w.id,name:compactApartment(w.apartment)+' · '+mask(w.fullName),prize:w.prize,location:w.location,apartment:w.apartment,days:w.days,wonAt:w.wonAt}));\"\n    );\n\n    text=text.replace(\"byId('nextPrize').textContent = PRIZES[state.results.length] || 'Completed';\",\"byId('nextPrize').textContent = currentPrize();\");\n    text=text.replace(\"byId('spinProgress').textContent = `${state.results.length} / 8`;\",\"byId('spinProgress').textContent = `${weekResults().length} / ${weeklyWinnerTarget()}`;\");\n    text=text.replace(\"byId('prepareBtn').disabled = eligibleEntries().length < Math.max(1, 8-state.results.length) || state.results.length>=8 || spinning;\",\"byId('prepareBtn').disabled = eligibleGuestCount() < Math.max(1,weeklyWinnerTarget()-weekResults().length) || weekResults().length>=weeklyWinnerTarget() || spinning;\");\n    text=text.replace(\"byId('lockBtn').disabled = state.results.length>0 || spinning;\",\"byId('lockBtn').disabled = spinning;\");\n    text=text.replace(\"byId('lockBtn').onclick = async()=>{if(state.results.length||spinning)return;state.locked=!state.locked;save();await publishLiveState();};\",\"byId('lockBtn').onclick = async()=>{if(spinning)return;state.locked=!state.locked;save();await publishLiveState();};\");\n\n    text=text.replace(\n`  byId('prepareBtn').onclick = ()=>{\n    const need = 8 - state.results.length;\n    if(eligibleEntries().length < need) return alert(\\`At least ${need} unique verified guests are required for the remaining winner slots.\\`);\n    state.locked = true; save(); publishLiveState();\n    byId('confirmBox').classList.add('show'); byId('confirmInput').value=''; byId('confirmInput').focus();\n  };`,\n`  byId('prepareBtn').onclick = ()=>{\n    const need=weeklyWinnerTarget()-weekResults().length;\n    if(need<=0)return alert('This week’s rewards have already been completed.');\n    if(eligibleGuestCount()<need)return alert(\\`At least ${need} unique eligible guests are required for the remaining reward${need===1?'':'s'} this week.\\`);\n    state.locked=true;save();publishLiveState();\n    byId('confirmBox').classList.add('show');byId('confirmInput').value='';byId('confirmInput').focus();\n  };`\n    );\n\n    text=text.replace(\"if(spinning||state.results.length>=8) return;\",\"if(spinning||weekResults().length>=weeklyWinnerTarget()) return;\");\n    text=text.replace(\"const tickets=buildTickets(), eligibleIds=new Set(tickets.map(t=>t.entryId));\",\"const tickets=buildTickets();\");\n    text=text.replace(\"if(eligibleIds.size < 8-state.results.length) return alert('Not enough unique verified guests remain.');\",\"if(eligibleGuestCount() < weeklyWinnerTarget()-weekResults().length) return alert('Not enough unique eligible guests remain for this week.');\");\n    text=text.replace(\"prize:PRIZES[state.results.length]\",\"prize:currentPrize()\");\n    text=text.replace(\"prize=PRIZES[state.results.length]||'Prize'\",\"prize=currentPrize()||'Prize'\");\n    text=text.replace(\"prize:PRIZES[state.results.length],rotation:startAngle\",\"prize:currentPrize(),rotation:startAngle\");\n\n    text=text.replace(\n      \"byId('liveProgress').textContent=`${winners.length} / 8`;\\n    byId('livePrize').textContent=PRIZES[winners.length]||'Completed';\",\n      \"const liveWeekWinners=publicWeekResults(winners);byId('liveProgress').textContent=`${liveWeekWinners.length} / ${weeklyWinnerTarget()}`;\\n    byId('livePrize').textContent=WEEKLY_PRIZE_PLAN[currentCampaignWeek()][liveWeekWinners.length]||'Completed';\"\n    );\n    text=text.replace(\n      \"byId('livePrize').textContent = PRIZES[publicWinnerRows.length] || 'Completed';\\n    byId('liveProgress').textContent = `${publicWinnerRows.length} / 8`;\",\n      \"const publicCurrentWeek=publicWeekResults(publicWinnerRows);byId('livePrize').textContent = WEEKLY_PRIZE_PLAN[currentCampaignWeek()][publicCurrentWeek.length] || 'Completed';\\n    byId('liveProgress').textContent = `${publicCurrentWeek.length} / ${weeklyWinnerTarget()}`;\"\n    );\n\n    text=text.replace(\n`  byId('nextSpinBtn').onclick = ()=>{\n    byId('winnerOverlay').classList.remove('show'); spinning=false; currentTicketSignature=''; currentTickets=[]; wheelRotation=0; cancelAnimationFrame(spinRAF); byId('mainRotor').style.transform='rotate(0deg)'; byId('watchRotor').style.transform='rotate(0deg)'; setTelemetry(0,'Ready for ignition',''); render();\n    if(state.results.length < 8){ byId('confirmBox').classList.add('show'); setTimeout(()=>byId('confirmInput').focus(),100); }\n  };`,\n`  byId('nextSpinBtn').onclick = async()=>{\n    byId('winnerOverlay').classList.remove('show');spinning=false;currentTicketSignature='';currentTickets=[];wheelRotation=0;cancelAnimationFrame(spinRAF);byId('mainRotor').style.transform='rotate(0deg)';byId('watchRotor').style.transform='rotate(0deg)';setTelemetry(0,'','');\n    const weekDone=weekResults().length>=weeklyWinnerTarget();\n    if(weekDone){state.locked=false;save();await publishLiveState({status:'idle',locked:false,spinPlan:null});}\n    else{save();byId('confirmBox').classList.add('show');setTimeout(()=>byId('confirmInput').focus(),100);}\n  };`\n    );\n\n    text=text.replace(\"byId('drawBadge').textContent = state.results.length>=8 ? 'Draw Completed' : state.locked ? 'Entries Locked' : 'Entries Open';\",\"byId('drawBadge').textContent = weekResults().length>=weeklyWinnerTarget() ? `Week ${currentCampaignWeek()} Completed` : state.locked ? 'Entries Locked' : `Week ${currentCampaignWeek()} Entries Open`;\");\n    text=text.replace(\"byId('drawBadge').className = 'tag ' + (state.locked || state.results.length>=8 ? 'pending':'verified');\",\"byId('drawBadge').className = 'tag ' + (state.locked || weekResults().length>=weeklyWinnerTarget() ? 'pending':'verified');\");\n    text=text.replace(\"byId('entryCollapseMeta').textContent = `${state.entries.length} guest${state.entries.length===1?'':'s'} · ${state.entries.filter(x=>x.status==='verified').length} verified`;\",\"byId('entryCollapseMeta').textContent = `${state.entries.length} booking${state.entries.length===1?'':'s'} · ${eligibleGuestCount()} eligible this week`;\");\n    text=text.replace(\"byId('slotExplain').textContent = n ? `${n} stay day${n===1?'':'s'} will create ${n} wheel slot${n===1?'':'s'}.` : 'Enter your stay dates to calculate your wheel slots.';\",\"byId('slotExplain').textContent = n ? `${n} verified stay day${n===1?'':'s'} recorded. Weekly wheel slots are calculated from the stay-days that fall inside each draw week.` : 'Enter your stay dates to calculate your wheel slots.';\");\n    text=text.replace(\"populateUnits(); updateProgress(); render(); startHomeDemo(); fetchLiveState(); routeFromHash();\",\"populateUnits(); updateProgress(); render(); const aw=byId('activeWeekPill');if(aw)aw.textContent=`Week ${currentCampaignWeek()} · ${currentCampaignWeek()===4?'₦1,000,000 Grand Finale':('Next Reward '+currentPrize())}`; startHomeDemo(); fetchLiveState(); routeFromHash();\");\n";
 try{
  let source=await (await fetch(CURRENT,{cache:'no-store'})).text();
  const oldLine="source=source.replace(marker,patch+'\n'+marker);";
  const injected="const weeklyPatch="+JSON.stringify(weekly)+";source=source.replace(marker,patch+'\n'+weeklyPatch+'\n'+marker);";
  if(!source.includes(oldLine))throw new Error('Weekly upgrade marker not found');
  source=source.replace(oldLine,injected);
  document.open('text/html','replace');document.write(source);document.close();
 }catch(err){console.error(err);document.body.innerHTML='<div class="boot"><div><b>Unable to load Guest Rewards</b><span>Please refresh the page.</span></div></div>'}
})();
</script>
</body>
</html>
