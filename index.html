<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c90000">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>Guest Rewards Spinwheel App</title>
<style>html,body{margin:0;min-height:100%;background:#f6f6f8;font-family:Arial,Helvetica,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;color:#222}.boot b{display:block;font-size:1.15rem}.boot span{display:block;margin-top:8px;color:#777;font-size:.85rem}.loader{width:50px;height:50px;margin:0 auto 16px;border-radius:50%;border:5px solid #eee;border-top-color:#c90000;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="boot"><div><div class="loader"></div><b>Guest Rewards</b><span>Loading live draw…</span></div></div>
<script>
(async()=>{
 const WRAPPER='https://raw.githubusercontent.com/KingAmada/shortletreward/07934fd6ba4b0e59159db740c8b5648e5b20b0cb/index.html';
 try{
  let source=await (await fetch(WRAPPER,{cache:'no-store'})).text();
  const patch=String.raw`
    /* v14 */
    text=text.replace('<div class="kicker">Public Guest Viewing Page</div>','');
    text=text.replace("byId('winnerName').textContent = mask(winner.fullName);","byId('winnerName').textContent = compactApartment(winner.apartment)+' · '+mask(winner.fullName);");
    text=text.replace("winner:{name:mask(winner.fullName),prize}","winner:{name:compactApartment(winner.apartment)+' · '+mask(winner.fullName),apartment:winner.apartment,prize}");

    /* Prevent a late idle write from overwriting the next spin. */
    text=text.replace("render(); publishLiveState({status:'idle',spinPlan:null});","render();");

    /* Publish the spin plan first, then start everyone from the same timestamp. */
    text=text.replace('function spinForWinner(){','async function spinForWinner(){');
    text=text.replace("const start=performance.now(), rotor=byId('mainRotor'),publicRotor=byId('watchRotor');","let start=0; const rotor=byId('mainRotor'),publicRotor=byId('watchRotor');");
    text=text.replace("startAt:Date.now(),startAngle,totalDelta,TA,TC,TD,tickets:publicTickets(),prize:PRIZES[state.results.length]","startAt:Date.now()+1200,startAngle,totalDelta,TA,TC,TD,tickets:publicTickets(),prize:PRIZES[state.results.length]");
    text=text.replace("publishLiveState(remoteLiveState);\n    startSpinSound();","await publishLiveState(remoteLiveState);\n    const syncWait=Math.max(0,spinPlan.startAt-Date.now());if(syncWait)await new Promise(r=>setTimeout(r,syncWait));start=performance.now();\n    startSpinSound();");

    /* Realtime is primary; polling remains only as a fallback. */
    text=text.replace("setInterval(fetchLiveState,500);","window.__raffleApplyLiveState=applyRemoteLiveState;\n  setInterval(fetchLiveState,2500);");

    /* Mobile live splash always includes apartment + masked guest name. */
    text=text.replace("const $=id=>document.getElementById(id);\n let lastSig='';","const $=id=>document.getElementById(id);\n const compactApt=a=>String(a||'').replace(/(\\d+) Bedroom Apartment — Unit (\\d+)/i,'$1BR U$2').replace(/Studio Apartment — Unit (\\d+)/i,'Studio U$1').replace(/Apartment — Unit /i,'Apt U');\n let lastSig='';");
    text=text.replace("$('lwName').textContent=w.name||w.fullName||'Guest';","const baseName=w.name||w.fullName||'Guest';$('lwName').textContent=baseName.includes('·')?baseName:((w.apartment?compactApt(w.apartment)+' · ':'')+baseName);");
    text=text.replace("$('lwClose').onclick=()=>$('liveWinnerOverlayV12').classList.remove('show');","window.__raffleShowLiveWinner=show;\n $('lwClose').onclick=()=>$('liveWinnerOverlayV12').classList.remove('show');");

    /* Load Supabase JS asynchronously after the document exists. This avoids the Chrome parser-blocking document.write warning. */
    const fastRealtime='<script>(()=>{const U="https://rwvngisohnflfofikspy.supabase.co",K="sb_publishable_V3B4qEnO8hPcHofizy8zoA_TDANaLlx";let W="";function A(s){if(!s)return;if(window.__raffleApplyLiveState)window.__raffleApplyLiveState(s);if(s.status==="winner"&&Array.isArray(s.winners)&&s.winners.length){const w=s.winners[s.winners.length-1],q=(w.id||w.name||"guest")+"|"+(w.prize||"")+"|"+s.winners.length;if(q!==W){W=q;if(window.__raffleShowLiveWinner)window.__raffleShowLiveWinner(w)}}}async function I(){try{const r=await fetch(U+"/rest/v1/guest_raffle_live?id=eq.main&select=state",{headers:{apikey:K,Authorization:"Bearer "+K},cache:"no-store"}),x=await r.json();A(x&&x[0]&&x[0].state)}catch(e){console.warn("Initial live sync failed",e)}}async function C(){try{const m=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");const c=m.createClient(U,K,{auth:{persistSession:false},realtime:{params:{eventsPerSecond:30}}});const h=c.channel("guest-raffle-live-fast-v14").on("postgres_changes",{event:"*",schema:"public",table:"guest_raffle_live",filter:"id=eq.main"},p=>A(p.new&&p.new.state)).subscribe(s=>{if(s==="SUBSCRIBED"){console.info("[Guest Rewards] Supabase Realtime connected");I()}});window.addEventListener("beforeunload",()=>{try{c.removeChannel(h)}catch(e){}})}catch(e){console.warn("Supabase Realtime module failed; polling fallback remains active",e)}}I();C()})();<\\/script>';
    text=text.replace('</body>',fastRealtime+'</body>');
  `;
  const marker="    document.open('text/html','replace');";
  if(!source.includes(marker))throw new Error('Upgrade marker not found');
  source=source.replace(marker,patch+'\n'+marker);
  document.open('text/html','replace');document.write(source);document.close();
 }catch(err){console.error(err);document.body.innerHTML='<div class="boot"><div><b>Unable to load Guest Rewards</b><span>Please refresh the page.</span></div></div>'}
})();
</script>
</body>
</html>
