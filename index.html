<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c90000">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>Guest Rewards Spinwheel App</title>
<style>html,body{margin:0;min-height:100%;background:#f6f6f8;font-family:Arial,Helvetica,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;color:#222}.boot b{display:block;font-size:1.15rem}.boot span{display:block;margin-top:8px;color:#777;font-size:.85rem}.loader{width:50px;height:50px;margin:0 auto 16px;border-radius:50%;border:5px solid #eee;border-top-color:#c90000;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="boot"><div><div class="loader"></div><b>Guest Rewards</b><span>Loading weekly rewards…</span></div></div>
<script>
(async()=>{
  const BROKEN='https://raw.githubusercontent.com/KingAmada/shortletreward/5039b3389f66db1b227d099db4f349a987fb6693/index.html';
  try{
    let source=await (await fetch(BROKEN,{cache:'no-store'})).text();
    const broken='const oldLine="source=source.replace(marker,patch+\'\\n\'+marker);";';
    const fixed='const oldLine="source=source.replace(marker,patch+\'\\\\n\'+marker);";';
    if(!source.includes(broken)) throw new Error('Repair target not found');
    source=source.replace(broken,fixed);
    document.open('text/html','replace');
    document.write(source);
    document.close();
  }catch(err){
    console.error(err);
    document.body.innerHTML='<div class="boot"><div><b>Unable to load Guest Rewards</b><span>Please refresh the page.</span></div></div>';
  }
})();
</script>
</body>
</html>
