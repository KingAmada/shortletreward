name: Raffle v11 live winner upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raffle-v11-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upgrade raffle app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text()

          # Favicon
          text = text.replace(
              '<meta name="theme-color" content="#c90000">\n<title>Guest Rewards Spinwheel App</title>',
              '<meta name="theme-color" content="#c90000">\n<link rel="icon" type="image/svg+xml" href="./favicon.svg">\n<link rel="apple-touch-icon" href="./favicon.svg">\n<title>Guest Rewards Spinwheel App</title>'
          )

          # Prize presentation and actual draw order: lowest rewards first, million-naira finale last.
          text = text.replace(
              '<div class="prizeRow"><div class="prizeAmount">₦1,000,000</div><div class="prizeMeta">1 Winner</div></div>\n          <div class="prizeRow"><div class="prizeAmount">₦100,000</div><div class="prizeMeta">3 Winners</div></div>\n          <div class="prizeRow"><div class="prizeAmount">₦50,000</div><div class="prizeMeta">4 Winners</div></div>',
              '<div class="prizeRow"><div class="prizeAmount">₦50,000</div><div class="prizeMeta">4 Winners</div></div>\n          <div class="prizeRow"><div class="prizeAmount">₦100,000</div><div class="prizeMeta">3 Winners</div></div>\n          <div class="prizeRow"><div class="prizeAmount">₦1,000,000</div><div class="prizeMeta">1 Winner</div></div>'
          )
          text = text.replace(
              "const PRIZES = ['₦1,000,000','₦100,000','₦100,000','₦100,000','₦50,000','₦50,000','₦50,000','₦50,000'];",
              "const PRIZES = ['₦50,000','₦50,000','₦50,000','₦50,000','₦100,000','₦100,000','₦100,000','₦1,000,000'];"
          )

          # Premium wheel hubs.
          text = text.replace('<div class="hub">Guest<br><b>Rewards</b></div>', '<div class="hub wheelHub homeHub"><span class="hubTop">GUEST</span><b>REWARDS</b><small>SPIN</small></div>')
          text = text.replace('<div class="hub">Live<br><b>Draw</b><small id="watchHubSlots">0 slots</small></div>', '<div class="hub wheelHub liveHub"><span class="hubTop"><i class="hubDot"></i>LIVE</span><b>DRAW</b><small id="watchHubSlots">25 APARTMENTS</small></div>')
          text = text.replace('<div class="hub">Guest<br><b>Draw</b><small id="hubSlots">0 slots</small></div>', '<div class="hub wheelHub adminHub"><span class="hubTop">OFFICIAL</span><b>DRAW</b><small id="hubSlots">0 SLOTS</small></div>')

          hub_css = '''
          .hub.wheelHub{position:absolute;z-index:6;width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;background:radial-gradient(circle at 35% 25%,#fff4a7 0%,#e6ab11 24%,#8d5600 53%,#17120a 78%,#070707 100%);border:3px solid #fff7d4;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.56),inset 0 0 0 2px rgba(255,206,79,.45),inset 0 0 18px rgba(255,220,114,.18);overflow:hidden}
          .hub.wheelHub:before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(255,239,180,.55);box-shadow:inset 0 0 12px rgba(0,0,0,.35);pointer-events:none}
          .hub.wheelHub>*{position:relative;z-index:2}
          .hubTop{display:flex;align-items:center;justify-content:center;gap:4px;color:#fff0a5;font-size:.49rem;font-weight:950;letter-spacing:.15em;line-height:1;text-shadow:0 1px 2px #000}
          .hub.wheelHub b{display:block;margin:2px 0 0;font:950 .98rem/.9 Impact,"Arial Black",sans-serif;letter-spacing:.045em;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.75)}
          .hub.wheelHub small{display:block;max-width:78px;margin-top:5px;padding:3px 7px;border-radius:999px;background:rgba(0,0,0,.36);border:1px solid rgba(255,239,174,.38);color:#fff7d1;font-size:.47rem;font-weight:900;letter-spacing:.045em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .hubDot{width:5px;height:5px;border-radius:50%;background:#43ee90;box-shadow:0 0 8px rgba(67,238,144,.9)}
          .liveHub{box-shadow:0 10px 24px rgba(0,0,0,.56),0 0 24px rgba(240,188,51,.26),inset 0 0 0 2px rgba(255,206,79,.45)!important}
          '''
          if '.hub.wheelHub{' not in text:
              text = text.replace('.demoWinner{margin-top:10px;', hub_css + '\n.demoWinner{margin-top:10px;')

          # Public live winner splash, separate from admin controls.
          live_overlay = '''
          <div id="liveWinnerOverlay" class="overlay">
            <div class="scrim"></div>
            <div class="winnerSplash">
              <div id="liveConfetti" class="confetti"></div>
              <div class="small" style="text-transform:uppercase;font-weight:900;color:var(--gold);letter-spacing:.14em">Live Winner</div>
              <h2>Congratulations!</h2>
              <div id="liveWinnerName" class="winnerName">Guest</div>
              <div id="liveWinnerPrize" class="winnerMoney">₦0</div>
              <p>We will reach out to you for details of where to transfer the funds.</p>
              <div class="ctaRow" style="justify-content:center">
                <button id="closeLiveWinnerBtn" class="btn gold">Back to Live Draw</button>
              </div>
            </div>
          </div>
          '''
          if 'id="liveWinnerOverlay"' not in text:
              text = text.replace('</div>\n\n<script>\n(()=>{', '</div>\n\n' + live_overlay + '\n<script>\n(()=>{', 1)

          text = text.replace(
              "let remoteLiveState = {status:'idle',locked:false,tickets:[],winners:[],spinPlan:null,updatedAt:0};",
              "let remoteLiveState = {status:'idle',locked:false,tickets:[],winners:[],spinPlan:null,updatedAt:0};\n  let lastLiveWinnerSignature = '';\n  let liveWinnerOverlayOpen = false;"
          )

          old = """    if(live.status==='spinning'&&live.spinPlan) animateRemoteSpin(live.spinPlan);\n    else if(live.status==='winner'){setLiveOnlyTelemetry(0,'Winner locked','');}\n  }"""
          new = """    if(live.status==='spinning'&&live.spinPlan){\n      if(liveWinnerOverlayOpen){byId('liveWinnerOverlay').classList.remove('show');liveWinnerOverlayOpen=false;}\n      animateRemoteSpin(live.spinPlan);\n    } else if(live.status==='winner'){\n      setLiveOnlyTelemetry(0,'Winner locked','');\n      if(winners.length){\n        const latest=winners[winners.length-1];\n        const signature=`${latest.id||latest.name||latest.fullName||'guest'}|${latest.prize||''}|${winners.length}`;\n        if(signature!==lastLiveWinnerSignature){\n          lastLiveWinnerSignature=signature;\n          if(byId('watchScreen').classList.contains('active')) showLiveWinner(latest);\n        }\n      }\n    }\n  }"""
          text = text.replace(old, new)

          live_funcs = '''  function showLiveWinner(winner){
            const name=winner.name||winner.fullName||'Guest';
            byId('liveWinnerName').textContent=name;
            byId('liveWinnerPrize').textContent=winner.prize||'Prize';
            byId('liveWinnerOverlay').classList.add('show');
            liveWinnerOverlayOpen=true;
            burstConfettiInto(byId('liveConfetti'),90);
            playFanfare();
          }
          function burstConfettiInto(box,count=90){
            if(!box)return;box.innerHTML='';
            const colors=['#c90000','#f0bc33','#111114','#ffffff','#ff7b7b'];
            for(let i=0;i<count;i++){
              const p=document.createElement('i');
              p.style.left=(Math.random()*100)+'%';
              p.style.background=colors[i%colors.length];
              p.style.transform=`translateY(-20px) rotate(${Math.random()*60}deg)`;
              p.style.animationDelay=(Math.random()*.3)+'s';
              p.style.animationDuration=(1.8+Math.random()*1.4)+'s';
              box.appendChild(p);
            }
          }
          byId('closeLiveWinnerBtn').onclick=()=>{byId('liveWinnerOverlay').classList.remove('show');liveWinnerOverlayOpen=false;};

          '''
          if 'function showLiveWinner(' not in text:
              text = text.replace('  function showWinner(winner, prize, selectedIndex, totalSlots){', live_funcs + '  function showWinner(winner, prize, selectedIndex, totalSlots){')

          text = re.sub(
              r"  function burstConfetti\(\)\{\n    const box = byId\('confetti'\); box\.innerHTML='';\n    const colors = \['#c90000','#f0bc33','#111114','#ffffff','#ff7b7b'\];\n    for\(let i=0;i<110;i\+\+\)\{.*?\n    \}\n  \}",
              "  function burstConfetti(){ burstConfettiInto(byId('confetti'),110); }",
              text,
              flags=re.S
          )

          # Same-browser live tab should splash instantly too; cross-device viewers still use Supabase polling.
          old_bc = """      }else if(m.type==='winner'){\n        stopSpinSound();state=m.state||state;localStorage.setItem(KEY,JSON.stringify(state));currentTicketSignature='';currentTickets=[];render();pointerTick(true);playFanfare();\n      }"""
          new_bc = """      }else if(m.type==='winner'){\n        stopSpinSound();state=m.state||state;localStorage.setItem(KEY,JSON.stringify(state));currentTicketSignature='';currentTickets=[];render();pointerTick(true);\n        const incoming=m.winner||{};const sig=`${incoming.id||incoming.name||'guest'}|${incoming.prize||''}|${state.results.length}`;\n        if(byId('watchScreen').classList.contains('active')&&sig!==lastLiveWinnerSignature){lastLiveWinnerSignature=sig;showLiveWinner(incoming);}else playFanfare();\n      }"""
          text = text.replace(old_bc,new_bc)

          text = text.replace("byId('watchHubSlots').textContent=realTickets.length?`${realTickets.length} slot${realTickets.length===1?'':'s'}`:'25 apartments';", "byId('watchHubSlots').textContent=realTickets.length?`${realTickets.length} SLOT${realTickets.length===1?'':'S'}`:'25 APARTMENTS';")
          text = text.replace("byId('hubSlots').textContent = `${tickets.length} slot${tickets.length===1?'':'s'}`;", "byId('hubSlots').textContent = `${tickets.length} SLOT${tickets.length===1?'':'S'}`;")

          p.write_text(text)
          PY

          cat > favicon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d2d"/><stop offset="1" stop-color="#8f0000"/></linearGradient>
              <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe47d"/><stop offset="1" stop-color="#d18a00"/></linearGradient>
            </defs>
            <rect width="64" height="64" rx="16" fill="#111114"/>
            <circle cx="32" cy="32" r="24" fill="url(#g)" stroke="url(#gold)" stroke-width="3"/>
            <path d="M32 10v7M32 47v7M10 32h7M47 32h7M16.4 16.4l5 5M42.6 42.6l5 5M47.6 16.4l-5 5M21.4 42.6l-5 5" stroke="#ffe47d" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="32" cy="32" r="13" fill="#111114" stroke="#fff2bd" stroke-width="2"/>
            <text x="32" y="39" text-anchor="middle" font-family="Arial Black, Arial" font-size="21" font-weight="900" fill="#ffe47d">8</text>
          </svg>
          SVG

      - name: Commit upgraded app
        shell: bash
        run: |
          git config user.name "OpenAI GitHub App"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Improve live winner splash and draw anticipation"
          git push
